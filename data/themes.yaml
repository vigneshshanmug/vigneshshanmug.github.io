# Science and Medicine pages are built from this file.
# Each theme lists the papers to feature, by folder name in content/publication/ (order = display order).
# Theme summaries were drafted from the papers' abstracts; edit them freely.
# A paper can appear in more than one theme. Papers not listed here still appear on the full
# publications list (/publication/).

science:
  - id: lymphoma-ecosystems
    title: "Spatial ecology of lymphoma"
    summary: >-
      In many lymphomas the malignant cells are a small minority, surrounded by immune and stromal
      cells they depend on. Using genome-scale spatial transcriptomics, single-cell genomics and spatial
      proteomics, this work maps the cellular niches that sustain tumor cells, identifying IL13
      signaling through IL4R/IL13RA1 as a survival dependency in classic Hodgkin lymphoma, defining how
      Epstein–Barr virus reorganizes the Hodgkin lymphoma microenvironment, and charting the loss of
      lymph-node organizing stroma and the expansion of fibroblasts and GPNMB+ macrophages during
      follicular lymphoma transformation.
    papers:
      - genome-scale-spatial-mapping-hodgkin-lymphoma-2025
      - epstein-barr-virus-orchestrates-spatial-reorganization-2026
      - follicular-lymphoma-transformation-characterized-cytokine-associated-2026
      - cancer-specific-innate-adaptive-immune-rewiring-2024

  - id: spatial-methods
    title: "Spatial and computational genomics methods"
    summary: >-
      Tools for measuring and analyzing gene expression in intact tissue: Slide-tags single-nucleus
      spatial barcoding, joint spatial maps of T-cell receptors and transcriptomes, cell type-specific
      differential expression in spatial transcriptomics, stable tensor factorization for
      zero-inflated genomics data, and machine-learning cell type annotation from multiplexed tissue images.
    papers:
      - slide-tags-enables-single-nucleus-barcoding-2024
      - spatial-maps-t-cell-receptors-transcriptomes-2022
      - cell-type-specific-inference-differential-expression-2022
      - c-ziptf-stable-tensor-factorization-zero-2024
      - maps-pathologist-level-cell-type-annotation-2024

  - id: b-cell-signaling
    title: "Oncogenic signaling in B-cell lymphomagenesis"
    summary: >-
      How lymphoma-associated alterations rewire normal B-cell programs: Notch activation that is
      pervasive in splenic marginal zone lymphoma and concentrated in specific microenvironments,
      the inability of MYD88 L265P alone to transform mature B cells, and loss of miR-15a/16-1 in
      activated B cells driving plasma cell and mature B-cell neoplasms.
    papers:
      - notch-activation-pervasive-smzl-uncommon-dlbcl-2021
      - human-myd88l265p-insufficient-itself-drive-neoplastic-2019
      - mir-15a-16-1-deletion-activated-2021

medicine:
  - id: molecular-diagnostics
    title: "Molecular diagnostics in hematologic neoplasms"
    # IGV (igv.js) view of TP53 codon 72 in public 1000 Genomes exome data (sample HG01879, hg19), rendered for this site.
    image: "images/themes/igv-tp53.png"
    summary: >-
      Bringing sequencing into diagnostic practice: targeted next-generation sequencing of peripheral
      blood in patients with unexplained cytopenias, liquid-biopsy circulating tumor DNA profiling across
      hematopoietic neoplasms, and the clonal relationship between skin and bone marrow disease in
      cutaneous myeloid neoplasms.
    papers:
      - clinical-utility-targeted-next-generation-sequencing-2019
      - liquid-biopsy-based-circulating-tumour-ct-2024
      - cutaneous-manifestations-myeloid-neoplasms-exhibit-broad-2024
      - npm1-mutant-acute-myeloid-leukemia-relapsing-2021
      - molecular-versus-morphologic-classifications-myeloproliferative-neoplasms-2019

