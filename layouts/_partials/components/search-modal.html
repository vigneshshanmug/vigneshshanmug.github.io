{{/* Pagefind search modal. Loads the Pagefind bundle on first open (subpath-safe via relURL).
     Cmd/Ctrl-K opens, Esc closes, arrow keys move through results.
     If Pagefind is unavailable (e.g. local `hugo server` without an index), falls back to a Google site: search. */}}
<div class="gk-search" id="gk-search" role="dialog" aria-modal="true" aria-labelledby="gk-search-label" hidden data-pagefind-ignore>
  <div class="gk-search__backdrop" data-search-close></div>
  <div class="gk-search__panel">
    <label id="gk-search-label" for="gk-search-input" class="sr-only">{{ i18n "search_site" }}</label>
    <div class="gk-search__bar">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gk-search-input" type="search" autocomplete="off" placeholder="{{ i18n "search_placeholder" }}">
      <kbd>Esc</kbd>
    </div>
    <ul class="gk-search__results" id="gk-search-results" role="listbox" aria-label="{{ i18n "search_results" }}"></ul>
    <p class="gk-search__status" id="gk-search-status" aria-live="polite"></p>
  </div>
</div>
<script>
(function(){
  var modal=document.getElementById('gk-search'), input=document.getElementById('gk-search-input'),
      list=document.getElementById('gk-search-results'), status=document.getElementById('gk-search-status'),
      pf=null, lastFocus=null, timer=null, sel=-1;
  var PF_URL={{ "pagefind/pagefind.js" | relURL }};
  var SITE={{ site.BaseURL }};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fallback(q){
    var host=SITE.replace(/^https?:\/\//,'').replace(/\/$/,'');
    list.innerHTML='<li><a href="https://www.google.com/search?q='+encodeURIComponent('site:'+host+' '+q)+'">{{ i18n "search_google" }} “'+esc(q)+'”</a></li>';
  }
  function load(){
    if(pf!==null) return Promise.resolve(pf);
    return import(PF_URL).then(function(m){pf=m; return pf;}).catch(function(){pf=false; return false;});
  }
  function open(){
    lastFocus=document.activeElement; modal.hidden=false; document.body.classList.add('gk-noscroll');
    input.focus(); input.select(); load();
  }
  function close(){
    modal.hidden=true; document.body.classList.remove('gk-noscroll');
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  function highlight(i){
    var items=list.querySelectorAll('a'); if(!items.length) return;
    sel=(i+items.length)%items.length;
    items.forEach(function(a,j){a.parentNode.setAttribute('aria-selected',j===sel?'true':'false'); if(j===sel) a.focus();});
  }
  function run(){
    var q=input.value.trim(); sel=-1;
    if(!q){list.innerHTML=''; status.textContent=''; return;}
    load().then(function(p){
      if(!p){ fallback(q); status.textContent=''; return; }
      p.search(q).then(function(r){
        status.textContent=r.results.length+' {{ i18n "results" }}';
        return Promise.all(r.results.slice(0,12).map(function(x){return x.data();}));
      }).then(function(data){
        if(!data) return;
        list.innerHTML=data.map(function(d){
          return '<li role="option"><a href="'+d.url+'"><span class="gk-search__title">'+esc(d.meta.title||d.url)+'</span><span class="gk-search__excerpt">'+d.excerpt+'</span></a></li>';
        }).join('') || '';
        if(!data.length) fallback(q);
      });
    });
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-search-open]')){e.preventDefault(); open();}
    else if(e.target.closest('[data-search-close]')) close();
  });
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); modal.hidden?open():close();}
    else if(!modal.hidden){
      if(e.key==='Escape') close();
      else if(e.key==='ArrowDown'){e.preventDefault(); highlight(sel+1);}
      else if(e.key==='ArrowUp'){e.preventDefault(); highlight(sel-1);}
    }
  });
  input.addEventListener('input',function(){clearTimeout(timer); timer=setTimeout(run,180);});
})();
</script>
